# Publish the H2 formal release APK (built by run 40206234870) as a GitHub Release.
#
# Why this workflow exists: the browser cannot download Actions artifacts
# (its file transfer returns unknown for every artifact), so a Release
# cannot be created by uploading the APK from a browser session. This
# workflow downloads the artifact inside the runner with the GitHub CLI
# and creates the Release there, where the file is local.
name: Publish H2 release

on:
  workflow_dispatch:
    push:
      branches: [h2-android6-fix]
      paths:
        - .github/workflows/publish-h2-release.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download release APK artifact from run 40206234870
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p apk
          gh run download 40206234870 --name maidong-h2-release --dir apk --repo hlw287514788/maidong-ktv
          ls -l apk
          mv apk/app-release.apk maidong-2.1.3.apk
          ls -l maidong-2.1.3.apk

      - name: Create GitHub Release v2.1.3 with APK asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v2.1.3 maidong-2.1.3.apk \
            --repo hlw287514788/maidong-ktv \
            --target h2-android6-fix \
            --title "2.1.3" \
            --latest \
            --notes "麦动 KTV 2.1.3 正式版，针对极米 H2 安卓 6.0 修复了点歌闪退（安卓 6 不支持的高版本地图方法已换成兼容写法，点歌防护也已扩大），应用内更新地址已改为本仓库的 Release。注意：之前装的调试版包名不同，必须先卸载调试版再安装本正式版；以后正式版之间可以直接在应用内更新。"
